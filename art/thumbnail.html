<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Transbank Webpay — thumbnail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 720px; overflow: hidden; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
    .stage {
      width: 1280px; height: 720px;
      background:
        radial-gradient(720px 420px at 72% 28%, rgba(208,0,112,.16), transparent 60%),
        radial-gradient(640px 380px at 18% 80%, rgba(109,32,119,.12), transparent 55%),
        linear-gradient(145deg, #ffffff, #f7f2f9);
      display: grid; place-items: center;
      padding: 48px;
    }
    .panel {
      width: 980px;
      background: #fff;
      border: 1px solid #eadfee;
      border-radius: 22px;
      box-shadow: 0 30px 60px rgba(109,32,119,.14);
      padding: 48px 56px;
      display: grid;
      gap: 18px;
      justify-items: start;
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute; inset: 0 auto 0 0; width: 8px;
      background: linear-gradient(180deg, #6D2077, #D00070, #009CDD);
    }
    img.logo { height: 72px; width: auto; display: block; }
    p { font-size: 22px; color: #75787B; padding-left: 4px; }
    p strong { color: #6D2077; font-weight: 700; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="panel">
      <img class="logo" src="brand/webpay-plus.png" alt="Webpay Plus">
      <p><strong>Filament v5</strong> · Webpay Plus payments for Chile</p>
    </div>
  </div>
</body>
</html>
